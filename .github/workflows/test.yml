name: Test ledger and deployment template
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: ledger_test_ci_only
          POSTGRES_DB: ledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      TEST_DATABASE_URL: host=127.0.0.1 port=5432 dbname=ledger_test user=ledger_test password=ledger_test_ci_only connect_timeout=5
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check frontend/app.js
      - run: cfn-lint infra/template.yaml
